name: kalender_indonesia
description: "Kalender Indonesia - Hari libur, cuti bersama, dan hari besar."
publish_to: 'none'

version: 3.0.0+12

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: ^0.19.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  android_intent_plus: ^5.2.0
  device_calendar: ^4.3.3
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.1.0
  xml: ^7.0.1
  html: ^0.15.6
  geolocator: ^14.0.2
  video_player: ^2.11.1
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

# device_calendar 4.3.3 pins timezone ^0.9.0, but the app already depends on
# timezone ^0.11.1 for the device-calendar timezone fix — overriding avoids
# splitting the app onto two incompatible timezone databases.
dependency_overrides:
  timezone: ^0.11.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo-app.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#6B8F71"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
  linux:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo-app.png
    - assets/menu/
  fonts:
    - family: NotoSansJavanese
      fonts:
        - asset: assets/fonts/NotoSansJavanese.ttf
